# eza theme: Catppuccin Mocha colors + custom folder/file icons.
# Linked to ~/.config/eza/theme.yml by tools/install.sh.
# Keys: `man eza_colors-explanation`. Glyphs are Nerd Font v3 codepoints
# (https://www.nerdfonts.com/cheat-sheet), written as "\u"/"\U" escapes so
# they survive tools that strip private-use characters.

colourful: true

filekinds:
  normal: {foreground: "#cdd6f4"}
  directory: {foreground: "#89b4fa", is_bold: true}
  symlink: {foreground: "#94e2d5"}
  pipe: {foreground: "#f9e2af"}
  block_device: {foreground: "#fab387"}
  char_device: {foreground: "#fab387"}
  socket: {foreground: "#f5c2e7"}
  special: {foreground: "#cba6f7"}
  executable: {foreground: "#a6e3a1", is_bold: true}
  mount_point: {foreground: "#74c7ec", is_underline: true}

perms:
  user_read: {foreground: "#f9e2af"}
  user_write: {foreground: "#f38ba8"}
  user_execute_file: {foreground: "#a6e3a1"}
  user_execute_other: {foreground: "#a6e3a1"}
  group_read: {foreground: "#f9e2af"}
  group_write: {foreground: "#f38ba8"}
  group_execute: {foreground: "#a6e3a1"}
  other_read: {foreground: "#f9e2af"}
  other_write: {foreground: "#f38ba8"}
  other_execute: {foreground: "#a6e3a1"}
  special_user_file: {foreground: "#cba6f7"}
  special_other: {foreground: "#cba6f7"}
  attribute: {foreground: "#6c7086"}

size:
  major: {foreground: "#a6adc8"}
  minor: {foreground: "#a6adc8"}
  number_byte: {foreground: "#a6adc8"}
  number_kilo: {foreground: "#89dceb"}
  number_mega: {foreground: "#89b4fa"}
  number_giga: {foreground: "#cba6f7"}
  number_huge: {foreground: "#f38ba8"}
  unit_byte: {foreground: "#6c7086"}
  unit_kilo: {foreground: "#6c7086"}
  unit_mega: {foreground: "#6c7086"}
  unit_giga: {foreground: "#6c7086"}
  unit_huge: {foreground: "#6c7086"}

users:
  user_you: {foreground: "#b4befe"}
  user_root: {foreground: "#f38ba8"}
  user_other: {foreground: "#a6adc8"}
  group_yours: {foreground: "#b4befe"}
  group_other: {foreground: "#a6adc8"}
  group_root: {foreground: "#f38ba8"}

links:
  normal: {foreground: "#a6adc8"}
  multi_link_file: {foreground: "#fab387"}

git:
  new: {foreground: "#a6e3a1"}
  modified: {foreground: "#f9e2af"}
  deleted: {foreground: "#f38ba8"}
  renamed: {foreground: "#89dceb"}
  typechange: {foreground: "#cba6f7"}
  ignored: {foreground: "#6c7086"}
  conflicted: {foreground: "#eba0ac"}

git_repo:
  branch_main: {foreground: "#a6e3a1"}
  branch_other: {foreground: "#cba6f7"}
  git_clean: {foreground: "#a6e3a1"}
  git_dirty: {foreground: "#f9e2af"}

file_type:
  image: {foreground: "#f5c2e7"}
  video: {foreground: "#f5c2e7"}
  music: {foreground: "#f5c2e7"}
  crypto: {foreground: "#f38ba8"}
  document: {foreground: "#89b4fa"}
  compressed: {foreground: "#fab387"}
  temp: {foreground: "#6c7086"}
  compiled: {foreground: "#6c7086"}
  build: {foreground: "#f9e2af"}
  source: {foreground: "#cdd6f4"}

punctuation: {foreground: "#6c7086"}
date: {foreground: "#b4befe"}
inode: {foreground: "#6c7086"}
blocks: {foreground: "#6c7086"}
header: {foreground: "#cdd6f4", is_underline: true}
octal: {foreground: "#94e2d5"}
flags: {foreground: "#cba6f7"}
control_char: {foreground: "#f38ba8"}
broken_symlink: {foreground: "#f38ba8"}
broken_path_overlay: {foreground: "#f38ba8"}

# Folder and file icons by exact name. Folders match the same way as files.
filenames:
  # Home folders (same icons as the prompt's directory segment).
  Desktop: {icon: {glyph: "\U000f0379", style: {foreground: "#94e2d5"}}}
  Documents: {icon: {glyph: "\U000f0c82", style: {foreground: "#89b4fa"}}}
  Downloads: {icon: {glyph: "\U000f024d", style: {foreground: "#fab387"}}}
  Pictures: {icon: {glyph: "\U000f024f", style: {foreground: "#f5c2e7"}}}
  Music: {icon: {glyph: "\U000f1359", style: {foreground: "#f5c2e7"}}}
  Movies: {icon: {glyph: "\U000f19fa", style: {foreground: "#f5c2e7"}}}
  Library: {icon: {glyph: "\U000f179e", style: {foreground: "#6c7086"}}}
  Applications: {icon: {glyph: "\U000f0035", style: {foreground: "#cdd6f4"}}}
  dev: {icon: {glyph: "\U000f19fc", style: {foreground: "#74c7ec"}}}
