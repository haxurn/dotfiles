  sec: {icon: {glyph: "\U000f13da", style: {foreground: "#f38ba8"}}}
  experiments: {icon: {glyph: "\U000f0093", style: {foreground: "#f5c2e7"}}}
  opensource: {icon: {glyph: "", style: {foreground: "#a6e3a1"}}}
  client: {icon: {glyph: "\U000f024c", style: {foreground: "#fab387"}}}
