  # Project folders.
  .git: {icon: {glyph: "", style: {foreground: "#fab387"}}}
  .github: {icon: {glyph: "", style: {foreground: "#cdd6f4"}}}
  node_modules: {icon: {glyph: "", style: {foreground: "#a6e3a1"}}}
  src: {icon: {glyph: "\U000f0169", style: {foreground: "#89b4fa"}}}
  lib: {icon: {glyph: "\U000f03d6", style: {foreground: "#89b4fa"}}}
  scripts: {icon: {glyph: "\U000f0bc2", style: {foreground: "#a6e3a1"}}}
  bin: {icon: {glyph: "\U000f07b7", style: {foreground: "#a6e3a1"}}}
  tests: {icon: {glyph: "\U000f0668", style: {foreground: "#f9e2af"}}}
  test: {icon: {glyph: "\U000f0668", style: {foreground: "#f9e2af"}}}
  docs: {icon: {glyph: "\U000f14f7", style: {foreground: "#89b4fa"}}}
  tools: {icon: {glyph: "\U000f09ac", style: {foreground: "#fab387"}}}
  packages: {icon: {glyph: "\U000f03d6", style: {foreground: "#fab387"}}}
