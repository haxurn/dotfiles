  vscode: {icon: {glyph: "\U000f0a1e", style: {foreground: "#89b4fa"}}}
  assets: {icon: {glyph: "\U000f024f", style: {foreground: "#f5c2e7"}}}
  public: {icon: {glyph: "\U000f01e7", style: {foreground: "#89dceb"}}}

  # Config and project files.
  Brewfile: {icon: {glyph: "\U000f03d6", style: {foreground: "#f9e2af"}}}
  Dockerfile: {icon: {glyph: "\U000f0868", style: {foreground: "#89b4fa"}}}
  Makefile: {icon: {glyph: "", style: {foreground: "#fab387"}}}
  flake.nix: {icon: {glyph: "\U000f0717", style: {foreground: "#89dceb"}}}
  pubspec.yaml: {icon: {glyph: "", style: {foreground: "#89dceb"}}}
  .zshrc: {icon: {glyph: "\U000f1183", style: {foreground: "#a6e3a1"}}}
