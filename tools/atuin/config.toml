# atuin (linked to ~/.config/atuin/config.toml by tools/install.sh)
# Docs: https://docs.atuin.sh/configuration/config/

# Sync stays off until you run `atuin register` / `atuin login`.
auto_sync = false
update_check = false

# Ctrl-R UI
search_mode = "fuzzy"
filter_mode = "global"          # Ctrl-R inside the UI cycles: global, host, session, directory, workspace
workspaces = true               # "workspace" filter = current git repo
style = "compact"
inline_height = 25              # open below the prompt instead of full screen
show_preview = true
show_help = true
show_tabs = true
enter_accept = false            # Enter puts the command on the line; press Enter again to run
keymap_mode = "auto"            # follow zsh-vi-mode: insert/normal inside the search UI too

# Never record lines starting with a space, plus anything that looks like a secret.
secrets_filter = true
history_filter = [
  "^\\s",
  "(?i)(password|passwd|token|secret|api[_-]?key)=",
]

[stats]
common_subcommands = ["git", "docker", "kubectl", "npm", "pnpm", "cargo", "go", "brew", "flutter"]
