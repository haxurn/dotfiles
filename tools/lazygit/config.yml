# lazygit (~/.config/lazygit/config.yml; LG_CONFIG_FILE points here on macOS too)
gui:
  nerdFontsVersion: "3"
  border: rounded
  showRandomTip: false
  showBottomLine: false
  theme: # Gruvbox Dark
    activeBorderColor: ["#fabd2f", bold]
    inactiveBorderColor: ["#928374"]
    optionsTextColor: ["#83a598"]
    selectedLineBgColor: ["#3c3836"]
    cherryPickedCommitBgColor: ["#504945"]
    cherryPickedCommitFgColor: ["#fabd2f"]
    unstagedChangesColor: ["#fb4934"]
    defaultFgColor: ["#ebdbb2"]
    searchingActiveBorderColor: ["#fe8019"]
  authorColors:
    "*": "#d3869b"
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
  autoFetch: true
os:
  editPreset: nvim-remote # opens in the parent nvim when launched from its terminal
update:
  method: never
promptToReturnFromSubprocess: false
