# kitty (linked dir: ~/.config/kitty). Gruvbox Dark, matching nvim.
include themes/gruvbox-dark.conf

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
disable_ligatures never
font_features    +calt +liga

# Cursor / scrollback
cursor_shape           block
cursor_blink_interval  0.5
scrollback_lines       10000

# Window
window_padding_width     8
hide_window_decorations  yes
confirm_os_window_close  0
enable_audio_bell        no
background_opacity       1.0

# Shell
shell_integration  enabled
copy_on_select     yes

# macOS (ignored on Linux)
macos_option_as_alt                  yes
macos_quit_when_last_window_closed   yes
macos_titlebar_color                 background

# tmux owns tabs/splits; keep kitty's own out of the way
map ctrl+shift+t      no_op
map ctrl+shift+enter  no_op
map f11               toggle_fullscreen
map ctrl+shift+f5     load_config_file
