# Gruvbox Dark (medium contrast) -- matches tmux, fzf, bat, lazygit and the
# nvim gruvbox colorscheme. nvim runs transparent, so `background` below is
# what you actually see behind it.
[colors.primary]
background      = "#282828"
foreground      = "#ebdbb2"
dim_foreground  = "#a89984"
bright_foreground = "#fbf1c7"

[colors.cursor]
text   = "#282828"
cursor = "#ebdbb2"

[colors.vi_mode_cursor]
text   = "#282828"
cursor = "#8ec07c"

[colors.selection]
text       = "#282828"
background = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

[colors.dim]
black   = "#32302f"
red     = "#9d0006"
green   = "#79740e"
yellow  = "#b57614"
blue    = "#076678"
magenta = "#8f3f71"
cyan    = "#427b58"
white   = "#928374"
