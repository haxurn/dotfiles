# Catppuccin Frappe -- alternate palette, matches nvim's catppuccin frappe.
# Switch by pointing [general].import at this file in alacritty.toml.
[colors.primary]
background        = "#303446"
foreground        = "#c6d0f5"
dim_foreground    = "#838ba7"
bright_foreground = "#c6d0f5"

[colors.cursor]
text   = "#303446"
cursor = "#f2d5cf"

[colors.vi_mode_cursor]
text   = "#303446"
cursor = "#babbf1"

[colors.selection]
text       = "#303446"
background = "#c6d0f5"

[colors.normal]
black   = "#51576d"
red     = "#e78284"
green   = "#a6d189"
yellow  = "#e5c890"
blue    = "#8caaee"
magenta = "#f4b8e4"
cyan    = "#81c8be"
white   = "#b5bfe2"

[colors.bright]
black   = "#626880"
red     = "#e78284"
green   = "#a6d189"
yellow  = "#e5c890"
blue    = "#8caaee"
magenta = "#f4b8e4"
cyan    = "#81c8be"
white   = "#a5adce"

[colors.dim]
black   = "#51576d"
red     = "#e78284"
green   = "#a6d189"
yellow  = "#e5c890"
blue    = "#8caaee"
magenta = "#f4b8e4"
cyan    = "#81c8be"
white   = "#b5bfe2"
