# alacritty (linked dir: ~/.config/alacritty)
[general]
import = ["~/.config/alacritty/themes/alacritty-default.toml"]

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "None"
option_as_alt = "Both"          # macOS only, harmless on Linux

[scrolling]
history = 10000

[cursor]
style = { shape = "Block", blinking = "On" }

[selection]
save_to_clipboard = true
