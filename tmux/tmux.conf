# ~/.config/tmux/tmux.conf  (linked from dotfiles/tmux/tmux.conf)

# ── Shell: zsh wherever it lives (Linux /usr/bin/zsh, macOS /bin/zsh or Homebrew) ──
# run-shell executes through sh, so $(...) is expanded by sh, not tmux.
run-shell 'tmux set -g default-shell   "$(command -v zsh || echo /bin/sh)"'
run-shell 'tmux set -g default-command "$(command -v zsh || echo /bin/sh)"'

# ── Terminal & colors ──
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on

# ── General behavior ──
set -g escape-time 0
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
set -g detach-on-destroy off
set -g status-interval 5
set -g display-time 2000
set -g allow-passthrough on
set -g status-position bottom
set -g popup-border-lines rounded
setw -g aggressive-resize on

# ── Prefix: Ctrl-a ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind -N "Reload config" r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ── Splits / windows, stay in current path ──
unbind %
unbind-key '\'
bind-key -N "Split right" '\' split-window -h -c "#{pane_current_path}"
unbind '"'
bind -N "Split down" - split-window -v -c "#{pane_current_path}"
bind -N "New window here" c new-window -c "#{pane_current_path}"
bind -n S-Left previous-window
bind -n S-Right next-window
bind -N "Last window" Tab last-window

# ── Vim-style pane navigation & resizing ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
bind -N "Zoom pane" -r m resize-pane -Z
bind -N "Kill pane" q kill-pane

# ── Copy mode: vi keys. Clipboard handled by tmux-yank (pbcopy / wl-copy / xclip) ──
set-window-option -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind P paste-buffer

# ── Popups ──
# Alt-` : toggle a persistent scratch session in a floating window
bind -n 'M-`' if-shell -F '#{==:#{session_name},scratch}' 'detach-client' \
  'display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "tmux new-session -A -s scratch"'
bind -N "lazygit popup" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind -N "btop popup" b display-popup -E -w 85% -h 85% "btop"
bind -N "Project sessionizer" f display-popup -E -w 60% -h 60% "~/.config/tmux/scripts/sessionizer.sh"
bind -N "Session switcher" s display-popup -E -w 40% -h 40% "~/.config/tmux/scripts/sessionizer.sh --sessions"
bind -N "Window switcher (all sessions)" w display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/window-switcher.sh"
bind -N "Open a URL from this pane" u display-popup -E -w 70% -h 50% "~/.config/tmux/scripts/url-picker.sh"
bind -N "Scratch notes popup" N display-popup -E -w 70% -h 75% \
  'mkdir -p ~/notes && ${EDITOR:-nvim} ~/notes/scratch.md'
bind -N "Key cheat sheet" ? display-popup -E -w 70% -h 80% "tmux list-keys -N | less -R"

# ── Layouts & panes ──
bind -N "Dev layout: side + bottom panes" D \
  split-window -h -l 35% -c "#{pane_current_path}" \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -L
# Undo the dev layout (or any split): keep only the current pane, like vim :only.
bind -N "Close all other panes" O kill-pane -a
bind -N "Toggle synchronized panes" S \
  setw synchronize-panes \; display "sync panes: #{?pane_synchronized,on,off}"
bind -N "Kill session (confirm)" X confirm-before -p "kill session #S? (y/n)" kill-session

# ── Numbering ──
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── Plugins (TPM, XDG path) ──
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

set -g @yank_with_mouse off
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-delete-backup-after '365'
set -g @resurrect-processes 'btop lazygit'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── Styling: Gruvbox Dark (matches nvim) ──
# Pill segments use the rounded powerline caps U+E0B6 / U+E0B4.
# Icons are Nerd Font v3 codepoints written as \u escapes (nerdfonts.com/cheat-sheet);
# each is followed by a space so Ghostty/kitty draw it full size.
thm_bg="#282828"
thm_surface="#3c3836"
thm_surface2="#504945"
thm_overlay="#928374"
thm_subtext="#a89984"
thm_text="#ebdbb2"
thm_red="#fb4934"
thm_green="#b8bb26"
thm_yellow="#fabd2f"
thm_blue="#83a598"
thm_teal="#8ec07c"
thm_mauve="#d3869b"
thm_peach="#fe8019"

set -g status-style "fg=${thm_text},bg=default"
set -g status-left-length 100
set -g status-right-length 200
set -g window-status-separator ""

# Session pill: green normally, orange while prefix is held, yellow in copy mode.
mode_color="#{?client_prefix,${thm_peach},#{?pane_in_mode,${thm_yellow},${thm_green}}}"
mode_icon="#{?client_prefix,\U000f0633,#{?pane_in_mode,\U000f018f,\U000f056e}}"
set -g status-left "#[fg=${mode_color},bg=default]#[fg=${thm_bg},bg=${mode_color},bold]${mode_icon} #S#[fg=${mode_color},bg=default,nobold]  "

# Window pills: index, program icon, name, then zoom / bell / sync flags.
win_icon="#(~/.config/tmux/scripts/icon.sh #{pane_current_command})"
win_flags="#{?window_zoomed_flag, \U000f004c ,}#{?window_bell_flag, \U000f009a ,}#{?pane_synchronized, \U000f04e6 ,}"
set -g window-status-format "#[fg=${thm_surface},bg=default]#[fg=${thm_subtext},bg=${thm_surface}]#I ${win_icon} #W${win_flags}#[fg=${thm_surface},bg=default] "
set -g window-status-current-format "#[fg=${thm_blue},bg=default]#[fg=${thm_bg},bg=${thm_blue},bold]#I ${win_icon} #W${win_flags}#[fg=${thm_blue},bg=default,nobold] "
set -g window-status-bell-style "fg=${thm_red}"

# Window names: folder name for shells, program name otherwise. Manual renames stick.
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"

# Right side: sync warning, git branch, cpu, mem, battery, time pill.
set -g status-right "#{?pane_synchronized,#[fg=${thm_red}#,bold]\U000f04e6 SYNC  #[nobold],}#[fg=${thm_mauve}]#(~/.config/tmux/scripts/git-branch.sh '#{pane_current_path}')  #[fg=${thm_teal}]\U000f0ee0 #{cpu}  #[fg=${thm_blue}]\U000f035b #{mem}  #(~/.config/tmux/scripts/battery.sh)  #[fg=${thm_surface},bg=default]#[fg=${thm_text},bg=${thm_surface}]\U000f0150 %I:%M %p#[fg=${thm_surface},bg=default]"

set -g message-style "fg=${thm_text},bg=${thm_surface}"
set -g message-command-style "fg=${thm_yellow},bg=${thm_surface}"
set -g mode-style "fg=${thm_bg},bg=${thm_blue}"
set -g clock-mode-colour "${thm_blue}"
set -g popup-border-style "fg=${thm_surface2}"

# ── Panes ──
# Inactive panes get dimmer default text so the active one stands out.
set -g window-style "fg=${thm_subtext}"
set -g window-active-style "fg=${thm_text}"
set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-style "fg=${thm_surface2}"
set -g pane-active-border-style "fg=${thm_green}"
# Label on each pane border: number, program icon + name, folder.
set -g pane-border-format "#{?pane_active,#[fg=${thm_green}#,bold],#[fg=${thm_overlay}]} #P #(~/.config/tmux/scripts/icon.sh #{pane_current_command}) #{pane_current_command} #[nobold]#[fg=${thm_overlay}]· #{b:pane_current_path} "
# Show the labels only when a window has more than one pane.
set -g pane-border-status off
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

# Initialize TPM (keep last)
run '~/.config/tmux/plugins/tpm/tpm'
