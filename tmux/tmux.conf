# ~/.config/tmux/tmux.conf  (linked from dotfiles/tmux/tmux.conf)

# ── Shell: zsh wherever it lives (Linux /usr/bin/zsh, macOS /bin/zsh or Homebrew) ──
# run-shell executes through sh, so $(...) is expanded by sh, not tmux.
run-shell 'tmux set -g default-shell   "$(command -v zsh || echo /bin/sh)"'
run-shell 'tmux set -g default-command "$(command -v zsh || echo /bin/sh)"'

# ── Terminal & colors ──
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on

# ── General behavior ──
set -g escape-time 0
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
set -g detach-on-destroy off
set -g status-interval 5
set -g display-time 2000
set -g allow-passthrough on
set -g status-position bottom
set -g popup-border-lines rounded
setw -g aggressive-resize on

# ── Prefix: Ctrl-a ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ── Splits / windows, stay in current path ──
unbind %
unbind-key '\'
bind-key '\' split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n S-Left previous-window
bind -n S-Right next-window
bind Tab last-window

# ── Vim-style pane navigation & resizing ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
bind -r m resize-pane -Z
bind q kill-pane

# ── Copy mode: vi keys. Clipboard handled by tmux-yank (pbcopy / wl-copy / xclip) ──
set-window-option -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind P paste-buffer

# ── Popups ──
# Alt-` : toggle a persistent scratch session in a floating window
bind -n 'M-`' if-shell -F '#{==:#{session_name},scratch}' 'detach-client' \
  'display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "tmux new-session -A -s scratch"'
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind b display-popup -E -w 85% -h 85% "btop"
bind f display-popup -E -w 60% -h 60% "~/.config/tmux/scripts/sessionizer.sh"
bind s display-popup -E -w 40% -h 40% "~/.config/tmux/scripts/sessionizer.sh --sessions"

# ── Numbering ──
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── Plugins (TPM, XDG path) ──
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

set -g @yank_with_mouse off
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-delete-backup-after '365'
set -g @resurrect-processes 'btop lazygit'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── Styling: Catppuccin Mocha ──
thm_bg="#1e1e2e"
thm_surface="#313244"
thm_overlay="#6c7086"
thm_text="#cdd6f4"
thm_green="#a6e3a1"
thm_blue="#89b4fa"
thm_teal="#94e2d5"
thm_mauve="#cba6f7"
thm_peach="#fab387"

set -g status-left-length 100
set -g status-style "fg=${thm_text},bg=default"
set -g status-left "#[fg=${thm_green},bold] #S #[fg=${thm_overlay}]│ "
set -g status-right "#[fg=${thm_peach},bold]#{?client_prefix,󰘳 ,}#[fg=${thm_teal}]#{cpu} #[fg=${thm_mauve}]#{mem} #[fg=${thm_overlay}]%H:%M "
set -g window-status-current-format "#[fg=${thm_blue},bold]#I:#W#{?window_zoomed_flag, 󰊓 ,}"
set -g window-status-format "#[fg=${thm_overlay}]#I:#W"
set -g message-style "fg=${thm_text},bg=${thm_surface}"
set -g mode-style "fg=${thm_bg},bg=${thm_blue}"
set -g pane-border-style "fg=${thm_surface}"
set -g pane-active-border-style "fg=${thm_green}"
set -g popup-border-style "fg=${thm_surface}"

# Initialize TPM (keep last)
run '~/.config/tmux/plugins/tpm/tpm'
